<script>
    let valittuId = null;
console.log("JS ladattu");

// Lähetä uusi tapahtuma
function lahetaEvents(lomake){
    

    let tapahtuma = {
        event_name: lomake.event_name.value,
        event_date: lomake.event_date.value,
        event_time: lomake.event_time.value,
        description: lomake.description.value,
        link: lomake.link.value
    };

    let xmlhttp = new XMLHttpRequest();

    xmlhttp.onreadystatechange = function(){
        if(this.readyState === 4 && this.status === 200){
            naytaKaikki();   // Päivitä lista
            lomake.reset();  // Tyhjennä lomake
        }
    };

    xmlhttp.open("POST", "./php/luoda.php", true);
    xmlhttp.setRequestHeader("Content-type","application/x-www-form-urlencoded");
    xmlhttp.send("tapahtumat=" + encodeURIComponent(JSON.stringify(tapahtuma)));
}


// Päivitä valittu tapahtuma
function paivitaEvents(lomake){

    if(!valittuId){
        alert("Valitse ensin tapahtuma");
        return;
    }

    let tapahtuma = {
        id: valittuId,
        event_name: lomake.event_name.value,
        event_date: lomake.event_date.value,
        event_time: lomake.event_time.value,
        description: lomake.description.value,
        link: lomake.link.value
    };

    let xmlhttp = new XMLHttpRequest();

    xmlhttp.onreadystatechange = function(){
        if(this.readyState === 4 && this.status === 200){
            naytaKaikki();
            lomake.reset();
            valittuId = null;
        }
    };

    xmlhttp.open("POST", "./php/muokkaa.php", true);
    xmlhttp.setRequestHeader("Content-type","application/x-www-form-urlencoded");
    xmlhttp.send("tapahtumat=" + encodeURIComponent(JSON.stringify(tapahtuma)));
}

// Täytä lomake muokkausta varten
function muokkaa(id){
    valittuId = id;
    let rivi = document.getElementById('rivi'+id);
    let lomake = document.getElementById('tapahtumalomake');

    // Dataset-arvot voivat olla undefined, korjataan tyhjiksi merkkijonoiksi
    lomake.event_name.value = rivi.dataset.event_name || '';
    lomake.event_date.value = rivi.dataset.event_date || '';
    lomake.event_time.value = rivi.dataset.event_time || '';
    lomake.description.value = rivi.dataset.description || '';
    lomake.link.value = rivi.dataset.link || '';
}

// Näytä tapahtumat JSONista
function naytaTapahtumat(tapahtumat){
    let html = '<div class="dropdown-margin">';
    tapahtumat.forEach(t => {
        html += `
        <div class="block full-bleed-keltainen-kuultava-vasemmalle">
            <h2>${t.paiva} ${t.event_date} ${t.event_name} (${t.event_time})</h2>
            <p>${t.description || ''}</p>
            <p><button class="btn btn-danger btn-sm" onclick="poistaTapahtuma(${t.id})">Poista</button></p>
            <p><button class="btn btn-primary btn-sm" onclick="muokkaa(${t.id})">Muokkaa</button></p>
        </div>
        <div class="padding"></div>`;
    });
    html += '</div>';
    document.getElementById('ohjelma').innerHTML = html;
}
        function luoValikko(){
            //funktio hakee databasesta kaiken informaation jota tarvitaan valikon luomiseksi ja lähettää sen "piirto" funktiolle
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                    valikko=JSON.parse(this.responseText);
                    tulostaValikko(valikko);
            }
            else{
                let text='<li class="dropdown-item" href="#">Yhteysvirhe</li>';
                document.getElementById("paivaysvalikko").innerHTML=text;
            }
            };
            xmlhttp.open("GET", "./php/adminvalikko.php", true);
            xmlhttp.send();	
        }
        function tulostaValikko(valikko){
            //Funktio luo valikon josta valitaan mitä kuukautta ja vuotta näytetään
            let text='<li> <button class="dropdown-item" type="button" onclick="naytaKaikki()">Näytä Kaikki</button></li>';
            //luo valikon entryn josta valitaan kaikki tapahtumat
            for (let x in valikko){
                //luo loopilla kaikki uniikit databasen kuukausi/vuosi valikot
                text+='<li> <button class="dropdown-item" type="button" onclick="lahetaPaivays('+valikko[x].month+","+valikko[x].year+')">'+tulkitseKuukausi(valikko[x].month)+valikko[x].year+'</button></li>';
            }
            document.getElementById("paivaysvalikko").innerHTML=text;
            //lähettää muodostetun valikon paivaysvalikko nimiseen <div>iin
        }
        function lahetaPaivays(month, year){
            //lähettää kuukauden ja vuoden oihjelmalle jolla hakea kaikki tiedot joita tarvitaan dropdown menun tulosteen rakentamiseksi
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                tulos=JSON.parse(this.responseText);
                tulostaTapahtumat(tulos);
                }
                else {
                    virheilmoitusTapahtumissa()
                }               
            };
            xmlhttp.open("GET", "./php/admintapahtuma.php?month="+month+"&year="+year, true);
            xmlhttp.send();
        }
        function naytaKaikki(){
            //funktio joka hakee tiedot *kaikista* tapahtumista
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                kaikki=JSON.parse(this.responseText);
                tulostaTapahtumat(kaikki);
                }
                else {
                    virheilmoitusTapahtumissa()
                }
            };
            xmlhttp.open("GET", "./php/adminkaikkitapahtumat.php", true);
            xmlhttp.send();	
        }
        function poistaTapahtuma(id){
            //funktio joka avaa popup-ikkunan varmistaakseen tapahtuman poiston
        if(!confirm("Haluatko varmasti poistaa tämän tapahtuman?")){
        return;
            }

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    naytaKaikki(); 
                }
            };

            xmlhttp.open("GET", "./php/poista.php?id="+id, true);
            xmlhttp.send();
        } 
  // funktiot jotka muuntavat databasesta saadut päivämäärät haluttuun luettavaan muotoon
function formatDateToDisplay(dateStr) {
    const d = new Date(dateStr);
    let dd = String(d.getDate()).padStart(2, '0');
    let mm = String(d.getMonth() + 1).padStart(2, '0'); // kuukausi 0-11
    let yyyy = d.getFullYear();
    return dd + '-' + mm + '-' + yyyy;
}
function tulostaTapahtumat(tapahtumat){
    let text = '<div class="dropdown-margin">';

    for (let x in tapahtumat){
        let t = tapahtumat[x];

        let eventDate = t.event_date || '';
        let eventTime = t.event_time || '';
        let paiva = t.paiva || '';

        // Muodosta turvallinen näyttöteksti päivämäärälle ja ajalle
        let displayDate = eventDate ? formatDateToDisplay(eventDate) : '---';
        let displayTime = eventTime ? eventTime : '';

        let displayPaiva = paiva ? tulkitsePaiva(paiva) : '';

        text += '<div id="rivi'+t.id+'" ' +
                'class="block full-bleed-keltainen-kuultava-vasemmalle" ' +
                'data-event_name="'+(t.event_name || '')+'" ' +
                'data-event_date="'+eventDate+'" ' +
                'data-event_time="'+eventTime+'" ' +
                'data-description="'+(t.description || '')+'" ' +
                'data-link="'+(t.link || '')+'">';

        text += '<h2>' + displayPaiva + ' ' + displayDate + 
                ' ' + (t.event_name || '') + ' (' + displayTime + ')</h2>';

        text += '<p>' + (t.description || '') + '</p>';

        if(t.link){
            text += '<p><a href="'+t.link+'">Osta Lippu >></a></p>';
        } else {
            text += '<p><br></p>';
        }

        text += '<p>' +
                '<button type="button" class="btn btn-light btn-sm" onclick="muokkaa('+t.id+')">Muokkaa</button> ' +
                '<button class="btn btn-danger btn-sm" onclick="poistaTapahtuma('+t.id+')">Poista</button>' +
                '</p></div><div class="padding"></div>';
    }

    text += '</div>';
    document.getElementById("ohjelma").innerHTML = text;
}




        function tulkitseKuukausi(kuukausi){
        // funktio joka muuntaa databasesta saadut kuukaudet haluttuun luettavaan muotoon
            if (kuukausi==1){
                return "Tammikuu ";
            }
            else if(kuukausi==2){
                return "Helmikuu ";
            }
            else if(kuukausi==3){
                return "Maaliskuu ";
            }
            else if(kuukausi==4){
                return "Huhtikuu ";
            }
            else if(kuukausi==5){
                return "Toukokuu ";
            }
            else if(kuukausi==6){
                return "Kesäkuu ";
            }
            else if(kuukausi==7){
                return "Heinäkuu ";
            }
            else if(kuukausi==8){
                return "Elokuu ";
            }
            else if(kuukausi==9){
                return "Syyskuu ";
            }
            else if(kuukausi==10){
                return "Lokakuu ";
            }
            else if(kuukausi==11){
                return "Marraskuu ";
            }
            else if(kuukausi==12){
                return "Joulukuu ";
            }
            else{
                return "Virheellinen arvo"
            }
        }
        function tulkitsePaiva(paiva){
        // funktio joka muuntaa databasesta saadut päivät haluttuun luettavaan muotoon
            if (paiva=="Monday"){
                return "MA";
            }
            else if(paiva=="Tuesday"){
                return "TI";
            }
            else if(paiva=="Wednesday"){
                return "KE";
            }
            else if(paiva=="Thursday"){
                return "TO";
            }
            else if(paiva=="Friday"){
                return "PE";
            }
            else if(paiva=="Saturday"){
                return "LA";
            }
            else if(paiva=="Sunday"){
                return "SU";
            }      
            else {
                return "Virheellinen Arvo ";
        }
        }
        function virheilmoitusTapahtumissa(){
            let text='<div class="dropdown-margin"><div class="block full-bleed-keltainen-kuultava-vasemmalle"><h2>Yhteysvirhe!</h2><br><p>Jokin meni pieleen</p><br><a href="ohjelma.html">Yritä Uudestaan</a></div>';
            document.getElementById("ohjelma").innerHTML=text;
        }
</script>
