<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
        function luoValikko(){
            //funktio hakee databasesta kaiken informaation jota tarvitaan valikon luomiseksi ja lähettää sen "piirto" funktiolle
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                    valikko=JSON.parse(this.responseText);
                    tulostaValikko(valikko);
            }
            else{
                let text='<li class="dropdown-item" href="#">Yhteysvirhe</li>';
                document.getElementById("paivaysvalikko").innerHTML=text;
            }
            };
            xmlhttp.open("GET", "./php/valikko.php", true);
            xmlhttp.send();	
        }
        function tulostaValikko(valikko){
            //Funktio luo valikon josta valitaan mitä kuukautta ja vuotta näytetään
            let text='<li> <button class="dropdown-item" type="button" onclick="naytaKaikki()">Näytä Kaikki</button></li>';
            //luo valikon entryn josta valitaan kaikki tapahtumat
            for (let x in valikko){
                //luo loopilla kaikki uniikit databasen kuukausi/vuosi valikot
                text+='<li> <button class="dropdown-item" type="button" onclick="lahetaPaivays('+valikko[x].month+","+valikko[x].year+')">'+tulkitseKuukausi(valikko[x].month)+valikko[x].year+'</button></li>';
            }
            document.getElementById("paivaysvalikko").innerHTML=text;
            //lähettää muodostetun valikon paivaysvalikko nimiseen <div>iin
        }
        function lahetaPaivays(month, year){
            //lähettää kuukauden ja vuoden oihjelmalle jolla hakea kaikki tiedot joita tarvitaan dropdown menun tulosteen rakentamiseksi
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                tulos=JSON.parse(this.responseText);
                tulostaTapahtumat(tulos);
                }
                else {
                    virheilmoitusTapahtumissa()
                }               
            };
            xmlhttp.open("GET", "./php/tapahtuma.php?month="+month+"&year="+year, true);
            xmlhttp.send();
        }
        function naytaKaikki(){
            //funktio joka hakee tiedot *kaikista* tapahtumista
            xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                kaikki=JSON.parse(this.responseText);
                tulostaTapahtumat(kaikki);
                }
                else {
                    virheilmoitusTapahtumissa()
                }
            };
            xmlhttp.open("GET", "./php/kaikkitapahtumat.php", true);
            xmlhttp.send();	
        }
        function tulostaTapahtumat(tapahtumat){
            //funktio jolla luodaan tapahtumien html tuloste sivulle
            let text='<div class="dropdown-margin">';
            for (let x in tapahtumat){;
                text+='<div class="block full-bleed-keltainen-kuultava-vasemmalle">'+'<h2>'+tulkitsePaiva(tapahtumat[x].paiva)+' '+tapahtumat[x].date+' '+tapahtumat[x].event_name+' ('+tapahtumat[x].time+')'+'</h2><p>'
                    if(tapahtumat[x].description!=null){
                    //jos tapahtumalla ei ole kuvasuta, sitä ei postata
                    text+=tapahtumat[x].description
                    }
                    else{
                    text+="";
                    }
                    if(tapahtumat[x].link!=null){
                    //jos tapahtumalla ei ole tiketti myyntipalveluun linkkiä, sitä ei postata
                    text+='<br></p><p><a href="'+tapahtumat[x].link+'">Osta Lippu >></a><p>'
                    }
                    else{
                    text+="<p><br></p>";
                    }
                    text+='</div><div class="padding"></div>';
            }
            document.getElementById("ohjelma").innerHTML=text;            
        }
        function tulkitseKuukausi(kuukausi){
        // funktio joka muuntaa databasesta saadut kuukaudet haluttuun luettavaan muotoon
            if (kuukausi==1){
                return "Tammikuu ";
            }
            else if(kuukausi==2){
                return "Helmikuu ";
            }
            else if(kuukausi==3){
                return "Maaliskuu ";
            }
            else if(kuukausi==4){
                return "Huhtikuu ";
            }
            else if(kuukausi==5){
                return "Toukokuu ";
            }
            else if(kuukausi==6){
                return "Kesäkuu ";
            }
            else if(kuukausi==7){
                return "Heinäkuu ";
            }
            else if(kuukausi==8){
                return "Elokuu ";
            }
            else if(kuukausi==9){
                return "Syyskuu ";
            }
            else if(kuukausi==10){
                return "Lokakuu ";
            }
            else if(kuukausi==11){
                return "Marraskuu ";
            }
            else if(kuukausi==12){
                return "Joulukuu ";
            }
            else{
                return "Virheellinen arvo"
            }
        }
        function tulkitsePaiva(paiva){
        // funktio joka muuntaa databasesta saadut päivät haluttuun luettavaan muotoon
            if (paiva=="Monday"){
                return "MA";
            }
            else if(paiva=="Tuesday"){
                return "TI";
            }
            else if(paiva=="Wednesday"){
                return "KE";
            }
            else if(paiva=="Thursday"){
                return "TO";
            }
            else if(paiva=="Friday"){
                return "PE";
            }
            else if(paiva=="Saturday"){
                return "LA";
            }
            else if(paiva=="Sunday"){
                return "SU";
            }      
            else {
                return "Virheellinen Arvo ";
        }
        }
        function virheilmoitusTapahtumissa(){
            let text='<div class="dropdown-margin"><div class="block full-bleed-keltainen-kuultava-vasemmalle"><h2>Yhteysvirhe!</h2><br><p>Jokin meni pieleen</p><br><a href="ohjelma.html">Yritä Uudestaan</a></div>';
            document.getElementById("ohjelma").innerHTML=text;
        }
