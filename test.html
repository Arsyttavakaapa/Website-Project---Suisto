function tulostaEvents(events){
    let text="<table border='1'>";
    text+="<tr><th>Id</th><th>Event name</th><th>Toiminnot</th></tr>";

    for (let x in events){
        text+="<tr id='rivi"+events[x].id+"'>";
        text+="<td>"+events[x].id+"</td>";
        text+="<td>"+events[x].event_name+"</td>";
        text+="<td>";
        text+="<button onclick='muokkaa("+events[x].id+")'>Muokkaa</button> ";
        text+="<button onclick='poista("+events[x].id+")'>Poista</button>";
        text+="</td>";
        text+="</tr>";
    }

    text+="</table>";
    document.getElementById("events").innerHTML=text;
}
